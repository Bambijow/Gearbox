name: Bootstrap Gearbox source

on:
  push:
    branches: [staging]
    paths:
      - ".bootstrap/READY"

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: staging
          fetch-depth: 0

      - name: Rebuild archive
        shell: bash
        run: |
          cat .bootstrap/part-*.b64 | base64 -d > /tmp/gearbox.tar.gz
          mkdir -p /tmp/gearbox-src
          tar -xzf /tmp/gearbox.tar.gz -C /tmp/gearbox-src

      - name: Replace repository with unpacked plugin source
        shell: bash
        run: |
          rsync -a --delete --exclude '.git/' /tmp/gearbox-src/ ./
          git config user.name "Gearbox Bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "feat: publish Gearbox Claude Code plugin"
          git push origin HEAD:staging
