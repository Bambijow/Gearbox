name: Validate Gearbox

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate plugin structure
        run: python3 scripts/validate.py
      - name: Compile runtime scripts
        run: python3 -m compileall -q scripts
      - name: Orchestrator guard self-test
        run: python3 scripts/orchestrator_guard.py self-test
      - name: Capability routing self-test
        run: python3 scripts/capabilities.py --self-test
      - name: Invocation fingerprint self-test
        run: python3 scripts/invocation_fingerprint.py --self-test
      - name: Game asset router self-test
        run: python3 scripts/game_asset_router.py --self-test
      - name: Codex worker isolation/capability self-test
        run: python3 scripts/codex_worker.py --self-test
      - name: Run-state plan approval self-test
        run: python3 scripts/run_state.py self-test
      - name: Redaction self-test
        run: python3 scripts/redact.py --self-test
      - name: PR technical report guard self-test
        run: python3 scripts/pr_report_guard.py --self-test
      - name: PR body guard self-test
        run: python3 scripts/pr_body_guard.py --self-test
      - name: Plan guard self-test
        run: python3 scripts/plan_guard.py --self-test
      - name: Final review router self-test
        run: python3 scripts/final_review_router.py --self-test
      - name: Prompt budget self-test
        run: python3 scripts/prompt_budget.py --self-test
      - name: Enforce prompt byte ratchets
        run: python3 scripts/prompt_budget.py --check
      - name: Behavior eval harness self-test
        run: python3 scripts/behavior_eval.py self-test
      - name: Validate behavior eval scenarios
        run: python3 scripts/behavior_eval.py validate evals/behavior
      - name: Agentic benchmark harness self-test
        run: python3 scripts/agentic_bench.py self-test
      - name: Validate agentic benchmark example
        run: python3 scripts/agentic_bench.py validate benchmarks/agentic/manifest.example.json
      - name: Repair finding breaker self-test
        run: python3 scripts/repair_findings.py --self-test
      - name: Finding dedup registry self-test
        run: python3 scripts/finding_registry.py --self-test
      - name: Evidence reuse self-test
        run: python3 scripts/evidence.py self-test
      - name: Child lifecycle self-test
        run: python3 scripts/child_jobs.py --self-test
      - name: Usage ledger self-test
        run: python3 scripts/usage_ledger.py --self-test
      - name: Solution memory audit self-test
        run: python3 scripts/solutions_audit.py --self-test
      - name: Retro bundle self-test
        run: python3 scripts/retro_bundle.py --self-test
      - name: Gearbox repository solution audit
        run: python3 scripts/solutions_audit.py --dir docs/solutions --strict --check-index --allow-missing
      - name: Package plugin ZIP
        id: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          mkdir -p dist
          ARCHIVE="dist/gearbox-${VERSION}.zip"
          git archive --format=zip --output="${ARCHIVE}" HEAD

          python3 - "${ARCHIVE}" <<'PY'
          import sys
          import zipfile

          archive = sys.argv[1]
          required = {
              ".claude-plugin/plugin.json",
              "hooks/hooks.json",
              "README.md",
          }
          with zipfile.ZipFile(archive) as zf:
              names = set(zf.namelist())
              bad = [name for name in names if name.startswith(".git/")]
          missing = sorted(required - names)
          if missing:
              raise SystemExit(f"package missing required files: {missing}")
          if bad:
              raise SystemExit(f"package unexpectedly contains git metadata: {bad[:5]}")
          print(f"validated {archive}: {len(names)} entries")
          PY

          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "archive=${ARCHIVE}" >> "${GITHUB_OUTPUT}"

      - name: Upload plugin ZIP
        uses: actions/upload-artifact@v4
        with:
          name: gearbox-${{ steps.package.outputs.version }}
          path: ${{ steps.package.outputs.archive }}
          if-no-files-found: error
          retention-days: 30
