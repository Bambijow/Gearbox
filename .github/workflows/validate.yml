name: Validate Gearbox

on:
  push:
    branches: [staging, main]
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate plugin structure
        run: python3 scripts/validate.py
      - name: Compile runtime scripts
        run: python3 -m compileall -q scripts
      - name: Orchestrator guard self-test
        run: python3 scripts/orchestrator_guard.py self-test
      - name: Redaction self-test
        run: python3 scripts/redact.py --self-test
      - name: PR technical report guard self-test
        run: python3 scripts/pr_report_guard.py --self-test
      - name: PR body guard self-test
        run: python3 scripts/pr_body_guard.py --self-test
      - name: Plan guard self-test
        run: python3 scripts/plan_guard.py --self-test
      - name: Prompt budget self-test
        run: python3 scripts/prompt_budget.py --self-test
      - name: Enforce prompt byte ratchets
        run: python3 scripts/prompt_budget.py --check
      - name: Behavior eval harness self-test
        run: python3 scripts/behavior_eval.py self-test
      - name: Validate behavior eval scenarios
        run: python3 scripts/behavior_eval.py validate evals/behavior
      - name: Repair finding breaker self-test
        run: python3 scripts/repair_findings.py --self-test
      - name: Finding dedup registry self-test
        run: python3 scripts/finding_registry.py --self-test
      - name: Evidence reuse self-test
        run: python3 scripts/evidence.py self-test
      - name: Child lifecycle self-test
        run: python3 scripts/child_jobs.py --self-test
      - name: Usage ledger self-test
        run: python3 scripts/usage_ledger.py --self-test
      - name: Solution memory audit self-test
        run: python3 scripts/solutions_audit.py --self-test
      - name: Retro bundle self-test
        run: python3 scripts/retro_bundle.py --self-test
      - name: Gearbox repository solution audit
        run: python3 scripts/solutions_audit.py --dir docs/solutions --strict --check-index --allow-missing
